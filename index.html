<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f2eee5">
<meta name="description" content="CNCN《一日衣着》城市穿搭交互画册。跟着城市里两个日常去处，看整套造型与服装细节。">
<title>一日衣着 — CNCN 城市穿搭画册</title>
<link rel="stylesheet" href="ar.css">
<style>
:root{--paper:#f2eee5;--ink:#27231e;--muted:#655b50;--rule:#c9bfb2;--accent:#6d432e;--gutter:clamp(20px,4vw,66px);font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;color:var(--ink);background:var(--paper);color-scheme:light}
*{box-sizing:border-box}
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #975430;outline-offset:4px}
[hidden]{display:none!important}
.shell{max-width:1600px;margin:auto;padding-inline:var(--gutter)}
header{border-bottom:1px solid var(--rule)}
.masthead{min-height:73px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font:bold clamp(29px,3.2vw,41px)/1 Georgia,serif;letter-spacing:-.08em}
.edition{font-size:12px;color:var(--muted);letter-spacing:.16em}
.story{display:grid;grid-template-columns:minmax(265px,1fr) minmax(0,2.22fr);padding-block:32px 24px;gap:clamp(22px,3.6vw,60px)}
.copy{display:flex;flex-direction:column;min-width:0}
.opening{padding-top:clamp(3px,2vw,32px)}
h1,h2{font-family:"Songti SC","Noto Serif CJK SC","SimSun",Georgia,serif}
h1{margin:0;font-size:clamp(45px,5.1vw,85px);font-weight:600;line-height:1.12;letter-spacing:-.055em}
.question{margin:13px 0 22px;font-size:clamp(14px,1.2vw,17px);color:var(--muted)}
.scenes{display:flex;gap:8px;flex-wrap:wrap}
.scene{border:1px solid var(--rule);background:transparent;padding:9px 13px;min-height:44px;font-size:14px;transition:background .18s,color .18s,border-color .18s}
.scene:hover{border-color:var(--ink)}
.scene[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.notes{margin-top:auto;padding-top:clamp(32px,5.5vw,90px);padding-bottom:3px}
.notes-inner{border-top:1px solid var(--rule);padding-top:17px}
.location{margin:0 0 10px;color:var(--accent);font-size:12px;letter-spacing:.09em}
h2{margin:0;font-size:clamp(24px,2.4vw,41px);font-weight:600;line-height:1.25}
.description{margin:10px 0 0;font-size:14px;line-height:1.85;color:var(--muted)}
.look{margin:12px 0 0;font-size:12px;line-height:1.7}
.back{display:inline-flex;align-items:center;gap:8px;margin-top:14px;min-height:44px;border:0;padding:5px 0;background:transparent;text-decoration:underline;text-underline-offset:5px}
figure{margin:0;min-width:0}
.image-box{position:relative;aspect-ratio:3 / 2;overflow:hidden;isolation:isolate;background:#938475}
.image-box img{display:block;width:100%;height:100%;position:absolute;inset:0;object-fit:fill;transform-origin:0 0;transition:transform .53s cubic-bezier(.2,.65,.25,1)}
.image-box img.enter{animation:enter .36s ease-out}
@keyframes enter{from{opacity:.4}to{opacity:1}}
.hotspots{position:absolute;inset:0;pointer-events:none}
.hotspot{position:absolute;display:flex;align-items:center;gap:6px;transform:translate(-12px,-50%);background:transparent;border:0;padding:0;min-height:44px;pointer-events:auto}
.pin{display:grid;place-items:center;width:24px;height:24px;border:1px solid white;border-radius:50%;background:#27231eaa;color:white;font-size:17px;line-height:1;box-shadow:0 1px 4px #261c17a0}
.label{background:#f9f4e9;color:#27231e;padding:4px 8px;font-size:12px;white-space:nowrap;box-shadow:0 1px 4px #261c1750}
.hotspot:hover .label{background:#e4cdb7}
figcaption{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:46px;border-bottom:1px solid var(--rule);font-size:12px;color:var(--muted)}
figcaption button{min-height:44px;background:none;border:0;text-decoration:underline;text-underline-offset:4px;padding:0}
footer{margin-top:8px;border-top:1px solid var(--rule);padding-block:17px 20px;color:var(--muted);font-size:11px}
@media(max-width:760px){
.masthead{min-height:59px}.story{display:flex;flex-direction:column;gap:16px;padding-block:23px 17px}
.copy{display:contents}.opening{order:0;padding-top:0}.notes{order:2;margin-top:0;padding:0}figure{order:1}
h1{font-size:clamp(40px,11vw,58px)}.question{margin:5px 0 13px}.notes-inner{border-top:0;padding-top:0}
.hotspot{gap:3px}.label{padding:3px 5px}.pin{width:21px;height:21px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="shell masthead"><span class="brand">CNCN</span><span class="edition">城市穿搭画册 · AR 穿搭镜</span></div></header>
<main class="shell">
  <div class="story">
    <section class="copy" aria-label="场景与造型说明">
      <div class="opening">
        <h1>一日衣着</h1>
        <p class="question">今天，你要去哪里？</p>
        <div class="scenes" role="group" aria-label="选择去处">
          <button class="scene" data-scene="gallery" aria-pressed="true">去看展</button>
          <button class="scene" data-scene="dinner" aria-pressed="false">去赴约</button>
        </div>
        <div class="mode-row">
          <button class="ar-action" id="ar-start">开启 AR 试穿</button>
          <button class="ar-exit" id="ar-exit" hidden>← 退出试穿</button>
        </div>
        <p class="ar-error" id="ar-error" role="alert" hidden></p>
      </div>
      <div class="notes">
        <div class="notes-inner" aria-live="polite" aria-atomic="true">
          <p id="location" class="location"></p>
          <h2 id="title"></h2>
          <p id="description" class="description"></p>
          <p id="look" class="look"></p>
        </div>
      </div>
    </section>
    <figure aria-label="造型画面" id="campaign-photo">
      <div class="image-box">
        <img id="photo" alt="" width="1536" height="1024" fetchpriority="high">
        <div class="hotspots" id="hotspots" role="group" aria-label="服装细节">
          <button class="hotspot" data-detail="0"><span class="pin" aria-hidden="true">+</span><span class="label"></span></button>
          <button class="hotspot" data-detail="1"><span class="pin" aria-hidden="true">+</span><span class="label"></span></button>
        </div>
      </div>
      <figcaption><span id="image-caption"></span><button id="return" hidden>← 返回全身</button></figcaption>
    </figure>
    <figure class="ar-panel" id="ar-panel" aria-label="AR 穿搭镜" hidden>
      <div class="ar-stage" id="ar-stage">
        <video class="ar-video" id="ar-video" autoplay muted playsinline aria-label="实时前置相机"></video>
        <canvas class="ar-layer" id="ar-layer" aria-hidden="true"></canvas>
        <div class="ar-guide" id="ar-guide" aria-hidden="true" hidden></div>
        <span class="ar-tag">CNCN · 本地融合试穿</span>
      </div>
      <figcaption class="ar-caption">
        <span id="ar-caption" role="status"></span>
        <button class="ar-detail" id="ar-details">查看款式细节</button>
      </figcaption>
    </figure>
  </div>
</main>
<footer><div class="shell">CNCN 品牌营销课程原型 · AI 概念影像</div></footer>

const byId = id => document.getElementById(id);
const photo = byId('photo');
const sceneButtons = [...document.querySelectorAll('[data-scene]')];
const detailButtons = [...document.querySelectorAll('[data-detail]')];
const back = byId('return');
let selected = 'gallery';
let opened = null;

function positionImage(detail) {
  if (!detail) {
    photo.style.transform = '';
    return;
  }
  const [x,y] = detail.position.map(value=>value/100);
  const z = detail.zoom;
  const offset = origin => Math.max(1-z,Math.min(0,.5-origin*z))*100;
  photo.style.transform = 'translate('+offset(x)+'%,'+offset(y)+'%) scale('+z+')';
}
function render() {
  const scene = scenes[selected];
  const detail = opened===null ? null : scene.details[opened];
  byId('location').textContent = scene.location;
  byId('title').textContent = detail ? detail.label : scene.title;
  byId('description').textContent = detail ? detail.description : scene.description;
  byId('look').textContent = scene.outfit;
  byId('image-caption').textContent = detail ? scene.location+' · '+detail.label+'近景' : '全身造型 · 选一个标签查看细节';
  byId('hotspots').hidden = Boolean(detail);
  back.hidden = !detail;
  photo.alt = detail ? scene.outfit.split(' · ')[0]+'造型的'+detail.label+'局部。' : scene.alt;
  positionImage(detail);
  sceneButtons.forEach(button => button.setAttribute('aria-pressed',String(button.dataset.scene===selected)));
  detailButtons.forEach((button,index)=>{
    const {label,position:[x,y]} = scene.details[index];
    button.style.left = x+'%';
    button.style.top = y+'%';
    button.querySelector('.label').textContent = label;
    button.setAttribute('aria-label','查看'+label+'细节');
  });
}
function setScene(id) {
  const changed = !photo.hasAttribute('src') || selected!==id;
  selected = id;
  opened = null;
  if (changed) {
    photo.style.transition = 'none';
    photo.src = scenes[id].image;
    photo.classList.remove('enter');
  }
  render();
  if (changed) {
    void photo.offsetWidth;
    photo.style.transition = '';
    photo.classList.add('enter');
  }
}
function returnToLook() {
  const previous = opened;
  opened = null;
  render();
  detailButtons[previous].focus({preventScroll:true});
}
sceneButtons.forEach(button => button.addEventListener('click',()=>setScene(button.dataset.scene)));
detailButtons.forEach(button => button.addEventListener('click',()=>{
  opened = Number(button.dataset.detail);
  render();
  back.focus({preventScroll:true});
}));
back.addEventListener('click',returnToLook);
document.addEventListener('keydown',event=>{
  if (event.key==='Escape' && opened!==null) returnToLook();
});
setScene(selected);
const upcoming = new Image();
upcoming.src = scenes.dinner.image;
